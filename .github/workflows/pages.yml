name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Assemble Pages artifact
        run: |
          mkdir _site
          cp demo.html _site/index.html
          mkdir -p _site/packages/core/dist
          mkdir -p _site/packages/overlay/dist
          cp packages/core/dist/kntnt-engagement-metrics.min.js _site/packages/core/dist/
          cp packages/overlay/dist/kntnt-engagement-metrics-overlay.min.js _site/packages/overlay/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
